{% if page.flashcard %}<script>window.__flashcardMode = true;</script>{% endif %}

<script>
  (function applySavedTheme(){
    var saved = localStorage.getItem('site-theme');
    if (!saved) return;
    if (typeof jtd === 'undefined') return setTimeout(applySavedTheme, 10);
    jtd.setTheme(saved);
  })();
</script>

<style>
  /* Theme toggle button (just-the-docs header) */
  .theme-toggle-btn {
    margin-left: 0.75rem;
    padding: 0.25rem 0.6rem;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: var(--body-background-color);
    color: var(--body-text-color);
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1.2;
    align-self: center;
  }
  .theme-toggle-btn:hover {
    background: var(--sidebar-color);
  }

  /* Flashcard collapsibles */
  body.flashcard-mode details.flashcard {
    border-bottom: 1px solid var(--border-color);
    padding: 0.35rem 0;
    margin: 0;
  }
  body.flashcard-mode details.flashcard > summary {
    cursor: pointer;
    list-style: none;
    padding: 0.4rem 0.5rem 0.4rem 1.4rem;
    position: relative;
    border-radius: 4px;
  }
  body.flashcard-mode details.flashcard > summary::-webkit-details-marker { display: none; }
  body.flashcard-mode details.flashcard > summary::before {
    content: "▸";
    position: absolute;
    left: 0.4rem;
    top: 0.55rem;
    color: var(--link-color);
    font-size: 0.85rem;
    transition: transform 0.12s ease;
    transform-origin: center;
  }
  body.flashcard-mode details.flashcard[open] > summary::before {
    transform: rotate(90deg);
  }
  body.flashcard-mode details.flashcard > summary:hover {
    background: var(--sidebar-color);
  }
  body.flashcard-mode details.flashcard > summary > h3 {
    display: inline;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    border: none;
  }
  body.flashcard-mode details.flashcard > summary > h3 a.anchor-heading { display: none; }

  body.flashcard-mode .flashcard-controls {
    display: flex;
    gap: 0.5rem;
    margin: 0.75rem 0 1rem 0;
    flex-wrap: wrap;
  }
  body.flashcard-mode .flashcard-controls button {
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: var(--body-background-color);
    color: var(--body-text-color);
    cursor: pointer;
    font-size: 0.85rem;
  }
  body.flashcard-mode .flashcard-controls button:hover {
    background: var(--sidebar-color);
  }

  /* Slideshow overlay */
  .flashcard-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--body-background-color);
    color: var(--body-text-color);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .flashcard-topbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 0.8rem;
    border-bottom: 1px solid var(--border-color);
    font-size: 0.9rem;
    flex-wrap: wrap;
  }
  .flashcard-spacer { flex: 1; min-width: 0.5rem; }
  .flashcard-topbar button {
    padding: 0.35rem 0.7rem;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: var(--body-background-color);
    color: var(--body-text-color);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .flashcard-topbar button:hover { background: var(--sidebar-color); }
  .flashcard-progress { font-variant-numeric: tabular-nums; opacity: 0.75; }

  .flashcard-card {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 1.5rem clamp(1rem, 4vw, 2rem);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
  }
  .flashcard-q {
    font-size: clamp(1.25rem, 4.5vw, 1.6rem);
    font-weight: 600;
    line-height: 1.35;
  }
  .flashcard-q h3 { display: inline; margin: 0; padding: 0; font-size: inherit; border: none; }
  .flashcard-q a.anchor-heading { display: none; }

  .flashcard-a {
    margin-top: 1.25rem;
    font-size: clamp(0.95rem, 3.6vw, 1.05rem);
    line-height: 1.55;
  }
  .flashcard-a strong { color: var(--link-color); }
  .flashcard-a pre {
    white-space: pre-wrap;
    font-size: 0.85em;
    overflow-x: auto;
  }
  .flashcard-a code { word-break: break-word; }
  .flashcard-hint {
    margin-top: 1.5rem;
    opacity: 0.55;
    font-size: 0.85rem;
    text-align: center;
  }

  .flashcard-marks {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    padding: 0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border-color);
  }
  .flashcard-marks button {
    flex: 1;
    max-width: 220px;
    padding: 0.7rem 1rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--body-background-color);
    color: var(--body-text-color);
    cursor: pointer;
    font-size: 0.95rem;
  }
  .flashcard-marks button[data-action="mark-got"] { border-color: var(--link-color); }
  .flashcard-marks button:hover { background: var(--sidebar-color); }

  .flashcard-end {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem 1rem calc(2rem + env(safe-area-inset-bottom));
    text-align: center;
  }
  .flashcard-end-msg { font-size: 1.15rem; font-weight: 500; }
  .flashcard-end-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
  .flashcard-end-buttons button {
    padding: 0.7rem 1.2rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--body-background-color);
    color: var(--body-text-color);
    cursor: pointer;
    font-size: 0.95rem;
  }
  .flashcard-end-buttons button[data-action="review-missed"] { border-color: var(--link-color); }
  .flashcard-end-buttons button:hover { background: var(--sidebar-color); }

  body.flashcard-slideshow-open { overflow: hidden; }
</style>
