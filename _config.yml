title: AI Engineering Interview Prep
description: Cheat sheet for AI Engineering interviews — 494 questions across 14 topics.
remote_theme: just-the-docs/just-the-docs

baseurl: "/interview_prep"
url: "https://nick-ai.github.io"

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-readme-index

relative_links:
  enabled: true
  collections: true

readme_index:
  enabled: true
  remove_originals: true
  with_frontmatter: true

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 4
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true
color_scheme: light

aux_links:
  "View on GitHub":
    - "https://github.com/Nick-AI/interview_prep"

aux_links_new_tab: true

include:
  - README.md

exclude:
  - LICENSE
  - .DS_Store
  - .gitignore
  - vendor
  - Gemfile
  - Gemfile.lock
